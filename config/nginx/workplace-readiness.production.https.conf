server {
    listen 80;
    server_name covid.readiness.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name covid.readiness.in;

    ssl_certificate /etc/letsencrypt/live/covid.readiness.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/covid.readiness.in/privkey.pem;

    root /opt/workplace-readiness/app/web_files;
    index index.html;

    access_log /var/log/nginx/workplace-readiness.access.log;
    error_log /var/log/nginx/workplace-readiness.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

