[project]
name = "workplace-readiness"
version = "0.1.0"
description = "Maintainable backend for the COVID-19 Workplace Readiness Indicator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "gunicorn>=22.0",
    "pydantic-settings>=2.0",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["server_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
